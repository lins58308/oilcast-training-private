name: Train and publish Oilcast model
'on':
  workflow_dispatch:
  schedule:
    - cron: '17 0,6,12,18 * * *'
permissions:
  contents: read
concurrency:
  group: oilcast-public-model-publisher
  cancel-in-progress: false
jobs:
  train:
    if: github.event_name == 'workflow_dispatch' || vars.OILCAST_SERVICE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 verified 2026-10-12
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5 verified 2026-10-12
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify historical quality and Android contract before signing
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 run_training.py --as-of 2026-09-13T13:00:00Z --output output
          javac --release 11 -cp build/classes:build/json.jar -d build/classes tests/CloudContractTest.java tests/ModelTimelineTest.java tests/ModelTrainingCoverageTest.java
          java -cp build/classes:build/json.jar ModelTimelineTest
          java -cp build/classes:build/json.jar ModelTrainingCoverageTest .
          java -cp build/classes:build/json.jar CloudContractTest .
          if test -f tests/NeuralLearnerTest.java; then
            javac --release 11 -cp build/classes:build/json.jar -d build/classes tests/NeuralLearnerTest.java
            java -cp build/classes:build/json.jar NeuralLearnerTest
          fi
          python3 tests/model_quality_report.py output/model.json
          rm -rf output
      - name: Restore, train, sign, verify and publish
        env:
          MODEL_PUBLIC_REPOSITORY: lins58308/oilcast-models
          MODEL_PUBLISH_TOKEN: ${{ secrets.MODEL_PUBLISH_TOKEN }}
          MODEL_SIGNING_KEY_B64: ${{ secrets.MODEL_SIGNING_KEY_B64 }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 pipeline.py
