name: OilCast v6-v7 quality checks (read-only, no publishing)
'on':
  push:
    branches:
      - 'fix/**'
  pull_request:
    paths:
      - 'core/**'
      - 'src/**'
      - 'tests/**'
      - 'run_training.py'
      - 'pipeline.py'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout proposed model source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify publishing transport without credentials
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rebuild historical demo model (no network publishing)
        run: python3 run_training.py --as-of 2026-09-13T13:00:00Z --output output
      - name: Check timeline, chronology and App model contract
        run: |
          javac --release 11 -cp build/classes:build/json.jar -d build/classes tests/CloudContractTest.java tests/ModelTimelineTest.java
          java -cp build/classes:build/json.jar ModelTimelineTest
          java -cp build/classes:build/json.jar CloudContractTest .
          if test -f tests/NeuralLearnerTest.java; then
            javac --release 11 -cp build/classes:build/json.jar -d build/classes tests/NeuralLearnerTest.java
            java -cp build/classes:build/json.jar NeuralLearnerTest
          fi
      - name: Audit held-out error, direction and changed-price recall
        run: python3 tests/model_quality_report.py output/model.json
