name: OilCast Saturday pre-announcement nowcast vs Monday early forecast (research)
'on':
  push:
    branches: [feat/v6-policy-absorption-20261103, feat/v7-policy-absorption-20261103]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: contains(github.event.head_commit.message, '[run-nowcast]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Recover verified 27-year CPC and news checkpoint
        run: |
          set -euo pipefail
          python3 run_training.py --as-of 2026-09-13T13:00:00Z --output output/demo
          if [[ "$GITHUB_REF_NAME" == *v7* ]]; then VARIANT=v7; TAG=training-checkpoint-v7; else VARIANT=v6; TAG=training-checkpoint; fi
          echo "VARIANT=$VARIANT" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/lins58308/oilcast-models/releases/download/$TAG/checkpoint.json" \
            --output output/checkpoint.json
          java -cp build/classes:build/json.jar tw.oilcast.core.SemanticResearchDataset \
            . output/checkpoint.json output/accuracy-dataset.json "2026-11-03T02:00:00Z"
      - name: Retrieve immutable original CPC policy artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$VARIANT" == "v7" ]]; then RUN=41559307646; else RUN=41559298876; fi
          gh run download "$RUN" --repo lins58308/oilcast-training-private \
            -n "oilcast-accuracy-lab-$RUN" -D output
          test -s output/cpc-policy-history.json
          python3 - <<'PY'
          import json
          j=json.load(open('output/cpc-policy-history.json'))
          assert j['schema']==1 and j['notFuturePolicyAnswers'] and len(j['notices'])>=350
          print('CPC policy notices reused:',len(j['notices']),flush=True)
          PY
      - name: Compare separate 7-day and 2-day forecast lead times
        run: |
          python3 -m pip install --no-cache-dir 'numpy>=1.26,<3' 'catboost>=1.2.7,<2'
          python3 -m unittest discover -s tests -p 'test_official_daily_oil.py' -v
          python3 -m unittest discover -s tests -p 'test_policy_features.py' -v
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            'https://fred.stlouisfed.org/graph/fredgraph.csv?id=POILDUBUSDM&cosd=1992-01-01' \
            --output output/dubai-monthly.csv
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            'https://www2.moeaea.gov.tw/oil111/csv/GlobalOilOpenData.csv' \
            --output output/moea-daily.csv
          python3 research/accuracy_benchmark.py \
            --dataset output/accuracy-dataset.json \
            --variant "$VARIANT" \
            --dubai-csv output/dubai-monthly.csv \
            --official-daily output/moea-daily.csv \
            --cpc-policy output/cpc-policy-history.json \
            --saturday-nowcast --output "output/nowcast-$VARIANT"
      - name: Preserve blinded audit only, never auto-promote Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oilcast-saturday-nowcast-${{ github.run_id }}
          path: output/nowcast-*/accuracy-report.json
          if-no-files-found: warn
          retention-days: 30
