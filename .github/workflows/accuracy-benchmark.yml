name: OilCast accuracy lab - policy regimes and historic news (read-only)
'on':
  push:
    branches:
      - 'fix/v6-accuracy-leakage-20261103'
      - 'fix/v7-accuracy-research-20261103'
      - 'feat/v6-dubai-point-in-time-20261103'
      - 'feat/v7-dubai-point-in-time-20261103'
permissions:
  contents: read
jobs:
  benchmark:
    if: contains(github.event.head_commit.message, '[run-accuracy]')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Restore immutable historical checkpoint and build CPC timepoint features
        run: |
          set -euo pipefail
          python3 run_training.py --as-of 2026-09-13T13:00:00Z --output output/demo
          if [[ "$GITHUB_REF_NAME" == *v7* ]]; then
            VARIANT=v7; TAG=training-checkpoint-v7
          else
            VARIANT=v6; TAG=training-checkpoint
          fi
          echo "VARIANT=$VARIANT" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/lins58308/oilcast-models/releases/download/$TAG/checkpoint.json" \
            --output output/checkpoint.json
          python3 - <<'PY'
          import json
          s=json.load(open('output/checkpoint.json'))
          assert s['cloudStateSchema']==1 and len(s['rows'])>900
          print('CPC date points:',len(s['rows']),'world headlines:',len(s['multisource']['news']),flush=True)
          PY
          java -cp build/classes:build/json.jar tw.oilcast.core.SemanticResearchDataset \
            . output/checkpoint.json output/accuracy-dataset.json "2026-11-03T02:00:00Z"
      - name: Install tabular model and run chronological ablation research
        run: |
          python3 -m pip install --no-cache-dir 'numpy>=1.26,<3' 'catboost>=1.2.7,<2'
          python3 -m unittest discover -s tests -p 'test_dubai_proxy.py' -v
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            'https://fred.stlouisfed.org/graph/fredgraph.csv?id=POILDUBUSDM&cosd=1992-01-01' \
            --output output/dubai-monthly.csv
          head -n 2 output/dubai-monthly.csv
          python3 -m py_compile research/accuracy_benchmark.py
          python3 research/accuracy_benchmark.py --dataset output/accuracy-dataset.json \
            --variant "$VARIANT" --dubai-csv output/dubai-monthly.csv \
            --output "output/accuracy-$VARIANT"
      - name: Preserve original reproducible benchmark and never publish poor models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oilcast-accuracy-lab-${{ github.run_id }}
          path: output/accuracy-*/accuracy-report.json
          if-no-files-found: warn
          retention-days: 30
