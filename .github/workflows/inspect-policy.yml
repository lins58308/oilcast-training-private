name: Inspect original CPC policy notice archive read only
'on':
  push:
    branches:
      - feat/v6-policy-absorption-20261103
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[inspect-policy]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Inspect dated CPC article listings and press-release content
        run: |
          python3 -m pip -q install 'beautifulsoup4>=4.12,<5' 'requests>=2.31,<3'
          python3 - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          sess=requests.Session();sess.headers['User-Agent']='OilCast public-research/1.0 (non-commercial; rate-limited)'
          for page in [1,2,20,38]:
            url=f'https://www.cpc.com.tw/news2.aspx?PageSize=20&n=28&page={page}&sms=8920'
            r=sess.get(url,timeout=25);r.raise_for_status()
            soup=BeautifulSoup(r.text,'html.parser')
            ids=list(dict.fromkeys(re.findall(r'News_Content\.aspx\?[^\\"<> ]*?s=([0-9]+)',str(soup),re.I)))
            print('PAGE',page,'size',len(r.content),'candidateArticles',len(ids),'sample',ids[:6],flush=True)
            for a in soup.find_all('a',href=re.compile('News_Content',re.I))[:3]:
              print('LINK',repr(a.get('href')),repr(a.get_text(' ',strip=True)[:140]),flush=True)
          r=sess.get('https://www.cpc.com.tw/News_Content.aspx?n=28&s=112027',timeout=25);r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          text=soup.get_text(' ',strip=True)
          for keyword in ['刊登日期','按浮動油價','汽、柴油','吸收','維持亞鄰']:
            ix=text.find(keyword)
            print('ARTICLE',keyword,ix,repr(text[ix:ix+420]),flush=True)
          for s in soup.find_all(string=re.compile('刊登日期'))[:4]:
            print('DATE PARENT',str(s.parent.parent)[:700],flush=True)
          PY
