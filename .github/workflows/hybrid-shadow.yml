name: Hybrid shadow model - safe offline audit
'on':
  workflow_dispatch:
  pull_request:
    paths:
      - 'hybrid_shadow.py'
      - 'tests/test_hybrid_shadow.py'
      - '.github/workflows/hybrid-shadow.yml'
permissions:
  contents: read
jobs:
  shadow-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install CPU-only reproducible runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0+cpu
          python -m pip install numpy==2.3.5
      - name: Unit and causal-boundary tests
        run: python -m unittest discover -s tests -p 'test_hybrid_shadow.py' -v
      - name: Chronological shadow backtest - never publish to production
        run: python hybrid_shadow.py --epochs 30 --output output/hybrid-shadow-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-shadow-backtest
          path: output/hybrid-shadow-report.json
          retention-days: 30
